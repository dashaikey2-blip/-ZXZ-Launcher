
name: Build ZXZ Launcher APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            platforms;android-35
            build-tools;34.0.0
            build-tools;35.0.0

      - name: Extract ZXZ Launcher source
        run: |
          mkdir -p source
          unzip -q ZXZLauncher-1.1.0-source.zip -d source

      - name: Find Android project
        id: project
        shell: bash
        run: |
          FILE=$(find source -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: Gradle project not found in ZIP"
            find source -maxdepth 4 -type f
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $DIR"

      - name: Build Debug APK
        working-directory: .
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"

          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle wrapper missing"
            exit 1
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload ZXZ APK
        uses: actions/upload-artifact@v4
        with:
          name: ZXZ-Launcher-APK
          path: |
            source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
